{% set name = "minipcn" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/minipcn-{{ version }}.tar.gz
  sha256: ab27456b9618ff0a7cd393f292f3cece0b052823dfc96d4083efa30aef545da3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=45
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base
    - numpy
    - scipy
    - tqdm
    - array-api-compat
    - orng

test:
  imports:
    - minipcn
  commands:
    - pip check
    - python -m pytest tests/
  requires:
    - python {{ python_min }}
    - pip
    - pytest
  source_files:
    - tests
    - pyproject.toml

about:
  summary: A minimal preconditioned Crank-Nicolson MCMC sampler
  home: https://github.com/mj-will/minipcn
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mj-will
